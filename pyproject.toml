[project]
name = "invoice-processor"
version = "0.1.0"
description = "A Python package for processing invoices using AI-powered data extraction"
authors = ["Martijn Hilders"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dateparser>=1.3.0",
    "dotenv>=0.9.9",
    "logfire>=4.24.0",
    "pillow>=12.1.1",
    "pydantic>=2.12.5",
    "pydantic-ai>=1.60.0",
    "pymupdf>=1.27.1",
    "streamlit>=1.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",      # Pytest is moved here
]
